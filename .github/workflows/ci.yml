name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: gcc:13-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: dependances
        run: apt-get update && apt-get install -y --no-install-recommends cmake libopenmpi-dev

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: compilation
        run: cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    container: gcc:13-bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      # upload-artifact ne conserve pas le bit executable
      - name: droits d execution
        run: chmod +x build/bcast

      - name: dependances
        run: apt-get update && apt-get install -y --no-install-recommends cmake libopenmpi-dev

      # dans le conteneur CI on est root et le runner a peu de coeurs
      - name: ctest
        run: ctest --test-dir build --output-on-failure
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          OMPI_MCA_rmaps_base_oversubscribe: 1

      - name: mpirun direct
        run: mpirun --allow-run-as-root --oversubscribe -np 4 ./build/bcast

  # le runner heberge tourne sur le noeud de login du cluster GCP
  test_hpc:
    needs: build
    runs-on: [self-hosted, hpc-login]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # on recompile ici, l'environnement cible n'a pas la meme ABI que le conteneur
      - name: build sur le noeud de login
        shell: bash -l {0}
        run: |
          set -eo pipefail
          module load cmake openmpi
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: soumission et polling
        shell: bash -l {0}
        run: |
          set -eo pipefail
          module load openmpi
          JOBID=$(sbatch --parsable slurm/job_ci.sh)
          echo "job soumis $JOBID"
          while true; do
            STATE=$(sacct -j "$JOBID" -n -o State | head -1 | tr -d ' ')
            echo "$(date +%H:%M:%S) job $JOBID $STATE $(squeue -h -j "$JOBID" -o %r)"
            case "$STATE" in
              COMPLETED|FAILED|TIMEOUT|CANCELLED|NODE_FAIL|OUT_OF_MEMORY) break ;;
            esac
            sleep 30
          done
          cat "ci-$JOBID.out" || true
          test "$(sacct -j "$JOBID" -n -o ExitCode | head -1 | cut -d: -f1)" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpc-logs
          path: ci-*.out
          retention-days: 7

  # meme chose en trois lignes, lancee a la main pour comparer
  test_hpc_wait:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hpc-login]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: build sur le noeud de login
        shell: bash -l {0}
        run: |
          set -eo pipefail
          module load cmake openmpi
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: sbatch wait
        shell: bash -l {0}
        run: |
          set -eo pipefail
          module load openmpi
          sbatch --wait slurm/job_ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpc-logs-wait
          path: ci-*.out
          retention-days: 7

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,style --error-exitcode=1 src/

  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: tarball
        run: |
          tar czf bcast-${GITHUB_REF_NAME}.tar.gz -C build bcast
          sha256sum bcast-${GITHUB_REF_NAME}.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            bcast-*.tar.gz
            checksums.txt

  secret_demo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # registre bidon : l'echec est attendu, seul le non affichage du secret compte
      - name: login avorté avec le secret
        run: echo "$FAKE_REGISTRY_TOKEN" | docker login -u user --password-stdin registry.invalid || true
        env:
          FAKE_REGISTRY_TOKEN: ${{ secrets.FAKE_REGISTRY_TOKEN }}

      - name: le secret n'apparait pas
        run: |
          test -n "$FAKE_REGISTRY_TOKEN"
          echo "secret present en variable, non affiche dans les logs"
        env:
          FAKE_REGISTRY_TOKEN: ${{ secrets.FAKE_REGISTRY_TOKEN }}
